<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador de materiales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------
     COLORES Y ESTILO
     Cambia las variables de .cot para que combine con tu sitio.
     ------------------------------------------------------------ */
  body { margin: 0; background: #eceff3; }

  .cot {
    --cot-tinta: #1d2a3a;
    --cot-suave: #5b6878;
    --cot-linea: #d8dee6;
    --cot-guia: #b8c1cc;
    --cot-acento: #0b6e5b;
    --cot-acento-suave: #e2f1ed;
    --cot-aviso: #b45309;

    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(18px, 4vw, 44px) clamp(16px, 4vw, 32px);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--cot-tinta);
    line-height: 1.5;
  }
  .cot *, .cot *::before, .cot *::after { box-sizing: border-box; }
  .cot [hidden] { display: none !important; }
  .cot button, .cot input, .cot select { font: inherit; color: inherit; }
  .cot :focus-visible { outline: 3px solid var(--cot-acento); outline-offset: 2px; }

  /* Encabezado */
  .cot-titulo { margin: 0 0 6px; font-size: clamp(1.6rem, 3.2vw, 2.15rem); line-height: 1.15; font-weight: 600; letter-spacing: -0.015em; }
  .cot-sub { margin: 0 0 28px; max-width: 56ch; color: var(--cot-suave); }

  /* Distribución */
  .cot-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.7fr); gap: clamp(20px, 4vw, 40px); align-items: start; }
  .cot-recibo { position: sticky; top: 20px; }
  @media (max-width: 860px) {
    .cot-grid { grid-template-columns: minmax(0, 1fr); }
    .cot-recibo { position: static; }
  }

  /* Buscador */
  .cot-buscar { width: 100%; padding: 12px 14px; border: 1.5px solid var(--cot-linea); border-radius: 8px; background: #fff; margin-bottom: 20px; font-size: 1rem; }

  /* Categorías (acordeón) */
  .cot-categoria { border: 1.5px solid var(--cot-linea); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: #fff; }
  .cot-categoria-boton { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 16px; border: 0; background: #fff; cursor: pointer; text-align: left; font-weight: 600; font-size: 1rem; }
  .cot-categoria-boton:hover { background: var(--cot-acento-suave); }
  .cot-categoria-cuenta { font-weight: 400; font-size: .875rem; color: var(--cot-suave); }
  .cot-categoria-flecha { transition: transform .15s; flex: none; margin-left: 12px; }
  .cot-categoria[data-abierta="true"] .cot-categoria-flecha { transform: rotate(180deg); }
  .cot-categoria-cuerpo { border-top: 1px solid var(--cot-linea); }

  /* Filas de producto */
  .cot-producto { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--cot-linea); }
  .cot-producto:last-child { border-bottom: 0; }
  .cot-producto-texto { display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
  .cot-producto-nombre { font-weight: 500; }
  .cot-producto-precios { font-size: .8125rem; color: var(--cot-suave); font-variant-numeric: tabular-nums; }
  .cot-producto-controles { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  /* Cantidad (compacta, dentro de cada fila) */
  .cot-cant { display: flex; align-items: stretch; }
  .cot-cant button { width: 34px; border: 1.5px solid var(--cot-linea); background: #fff; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .cot-cant button:first-child { border-right: 0; border-radius: 8px 0 0 8px; }
  .cot-cant button:last-child { border-left: 0; border-radius: 0 8px 8px 0; }
  .cot-cant button:hover { background: var(--cot-acento-suave); }
  .cot-cant input {
    width: 56px; padding: 6px 4px; border: 1.5px solid var(--cot-linea); border-radius: 0;
    background: #fff; text-align: center; font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield; appearance: textfield;
  }
  .cot-cant input::-webkit-outer-spin-button,
  .cot-cant input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .cot-btn-agregar { padding: 8px 14px; border: 1.5px solid var(--cot-acento); border-radius: 8px; background: var(--cot-acento); color: #fff; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .cot-btn-agregar:hover { opacity: .9; }
  .cot-etiqueta-mayoreo { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 999px; background: var(--cot-acento-suave); color: var(--cot-acento); font-size: .75rem; font-weight: 500; }

  .cot-vacio { margin: 0; padding: 16px 0; color: var(--cot-suave); }

  /* Recibo / carrito */
  .cot-recibo { padding: 24px 22px 22px; border: 1px solid var(--cot-linea); border-top: 5px solid var(--cot-acento); border-radius: 4px 4px 10px 10px; background: #fff; }
  .cot-recibo h3 { margin: 0; font-size: 1.125rem; font-weight: 600; }
  .cot-fecha { margin: 2px 0 0; font-size: .875rem; color: var(--cot-suave); }
  .cot-lineas { margin-top: 18px; border-top: 1px dashed var(--cot-guia); }
  .cot-linea { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--cot-guia); }
  .cot-concepto { display: flex; flex-direction: column; min-width: 0; }
  .cot-nombre { font-weight: 500; }
  .cot-detalle { font-size: .875rem; color: var(--cot-suave); font-variant-numeric: tabular-nums; }
  .cot-linea-derecha { display: flex; align-items: baseline; gap: 10px; flex: none; }
  .cot-monto { font-weight: 500; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cot-quitar { border: 0; background: none; color: var(--cot-suave); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0 2px; }
  .cot-quitar:hover { color: var(--cot-aviso); }
  .cot-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 16px; }
  .cot-total span { font-weight: 500; }
  .cot-total strong { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .cot-nota { margin: 12px 0 0; font-size: .875rem; color: var(--cot-suave); }

  /* Botones de acción */
  .cot-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .cot-btn { flex: 1 1 auto; padding: 11px 16px; border: 1.5px solid var(--cot-acento); border-radius: 8px; background: #fff; color: var(--cot-acento); font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
  .cot-btn:hover:not(:disabled) { background: var(--cot-acento); color: #fff; }
  .cot-btn:disabled { opacity: .45; cursor: not-allowed; }
  .cot-btn-fuerte { background: var(--cot-acento); color: #fff; }
  .cot-estado { min-height: 1.4em; margin: 8px 0 0; font-size: .875rem; color: var(--cot-acento); }

  @media (prefers-reduced-motion: reduce) {
    .cot *, .cot *::before, .cot *::after { transition: none !important; }
  }
  @media print {
    body { background: #fff; }
    .cot-titulo, .cot-sub, .cot-izq, .cot-acciones { display: none; }
    .cot-grid { display: block; }
    .cot-recibo { position: static; border-color: #999; }
  }
</style>
</head>
<body>

<div class="cot" id="cotizador">
  <header>
    <h2 class="cot-titulo">Cotiza tus materiales</h2>
    <p class="cot-sub">Agrega los productos que necesitas de cualquier categoría; el precio baja solo al llegar a la cantidad de mayoreo.</p>
  </header>

  <div class="cot-grid">
    <div class="cot-izq">
      <input class="cot-buscar" id="buscador" type="search" placeholder="Buscar un producto (ej. varilla, cemento, PVC)…" aria-label="Buscar producto">
      <div id="categorias"></div>
    </div>

    <aside class="cot-recibo" aria-labelledby="recibo-titulo">
      <h3 id="recibo-titulo">Tu cotización</h3>
      <p class="cot-fecha" id="recibo-fecha"></p>
      <div class="cot-lineas" id="recibo-lineas"></div>
      <div class="cot-total" aria-live="polite" aria-atomic="true">
        <span>Total</span>
        <strong id="recibo-total">$0.00</strong>
      </div>
      <p class="cot-nota" id="recibo-nota"></p>
      <div class="cot-acciones">
        <button type="button" class="cot-btn cot-btn-fuerte" id="btn-wa" hidden>Enviar por WhatsApp</button>
        <button type="button" class="cot-btn" id="btn-copiar">Copiar</button>
        <button type="button" class="cot-btn" id="btn-imprimir">Imprimir</button>
      </div>
      <p class="cot-estado" id="estado-accion" role="status"></p>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ==============================================================
     CONFIGURACIÓN: aquí defines tu negocio, productos y precios.
     ============================================================== */
  const CONFIG = {
    negocio: "Nombre de tu distribuidora",
    moneda: "MXN",
    idioma: "es-MX",
    vigenciaDias: 15,
    nota: "Precios sujetos a confirmación según existencia.",
    whatsapp: "", // Número con código de país, sin + ni espacios. Ej.: 5215512345678

    // A partir de cuántas piezas se aplica el precio de mayoreo.
    // Puedes subir o bajar este número; aplica igual para todos los productos.
    cantidadMayoreo: 10,

    // Catálogo de productos. "menudeo" y "mayoreo" son el precio por unidad.
    // Puedes agregar, quitar o editar cualquier renglón.
    productos: [
      { id: "cemento-gris", categoria: "Cementantes", nombre: "Cemento gris 50 kg", unidad: "saco", menudeo: 265, mayoreo: 230 },
      { id: "mortero", categoria: "Cementantes", nombre: "Mortero 50 kg", unidad: "saco", menudeo: 235, mayoreo: 205 },
      { id: "cal", categoria: "Cementantes", nombre: "Cal hidratada", unidad: "saco", menudeo: 100, mayoreo: 85 },

      { id: "varilla-38", categoria: "Acero", nombre: "Varilla 3/8\" × 12 m", unidad: "pieza", menudeo: 208, mayoreo: 180 },
      { id: "varilla-12", categoria: "Acero", nombre: "Varilla 1/2\" × 12 m", unidad: "pieza", menudeo: 360, mayoreo: 315 },
      { id: "varilla-58", categoria: "Acero", nombre: "Varilla 5/8\" × 12 m", unidad: "pieza", menudeo: 560, mayoreo: 500 },
      { id: "alambron", categoria: "Acero", nombre: "Alambrón", unidad: "kg", menudeo: 35, mayoreo: 30 },
      { id: "alambre-recocido", categoria: "Acero", nombre: "Alambre recocido", unidad: "kg", menudeo: 48, mayoreo: 39 },
      { id: "armex", categoria: "Acero", nombre: "Armex 15×15", unidad: "pieza/m", menudeo: 140, mayoreo: 123 },

      { id: "block-1520", categoria: "Mampostería", nombre: "Block 15×20×40", unidad: "pieza", menudeo: 18, mayoreo: 15 },
      { id: "block-2020", categoria: "Mampostería", nombre: "Block 20×20×40", unidad: "pieza", menudeo: 22, mayoreo: 18 },
      { id: "tabique", categoria: "Mampostería", nombre: "Tabique rojo", unidad: "pieza", menudeo: 5.5, mayoreo: 4.3 },

      { id: "arena", categoria: "Agregados", nombre: "Arena", unidad: "m³", menudeo: 800, mayoreo: 650 },
      { id: "grava", categoria: "Agregados", nombre: "Grava 3/4\"", unidad: "m³", menudeo: 800, mayoreo: 650 },
      { id: "tepetate", categoria: "Agregados", nombre: "Tepetate", unidad: "m³", menudeo: 425, mayoreo: 325 },

      { id: "pvc-12", categoria: "Instalación hidráulica", nombre: "PVC 1/2\" × 6 m", unidad: "tubo", menudeo: 60, mayoreo: 50 },
      { id: "pvc-34", categoria: "Instalación hidráulica", nombre: "PVC 3/4\" × 6 m", unidad: "tubo", menudeo: 85, mayoreo: 70 },
      { id: "pvc-sanitario", categoria: "Instalación hidráulica", nombre: "PVC sanitario 4\" × 6 m", unidad: "tubo", menudeo: 230, mayoreo: 195 },

      { id: "pegazulejo", categoria: "Acabados", nombre: "Pegazulejo 20 kg", unidad: "saco", menudeo: 230, mayoreo: 190 },
      { id: "impermeabilizante", categoria: "Acabados", nombre: "Impermeabilizante 19 L", unidad: "cubeta", menudeo: 1200, mayoreo: 1000 },
      { id: "yeso", categoria: "Acabados", nombre: "Yeso 20-25 kg", unidad: "saco", menudeo: 150, mayoreo: 125 },

      { id: "clavo", categoria: "Herramienta y consumibles", nombre: "Clavo", unidad: "kg", menudeo: 45, mayoreo: 38 },
      { id: "disco-corte", categoria: "Herramienta y consumibles", nombre: "Disco de corte", unidad: "pieza", menudeo: 50, mayoreo: 40 }
    ]
  };

  /* ==============================================================
     A partir de aquí no necesitas editar nada.
     ============================================================== */

  const el = function (id) { return document.getElementById(id); };
  const esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  const formato = new Intl.NumberFormat(CONFIG.idioma, { style: "currency", currency: CONFIG.moneda });
  const dinero = function (n) { return formato.format(n); };
  const fechaHoy = new Date().toLocaleDateString(CONFIG.idioma, { day: "numeric", month: "long", year: "numeric" });

  const PRODUCTOS = CONFIG.productos;
  const porId = {};
  PRODUCTOS.forEach(function (p) { porId[p.id] = p; });

  // El carrito guarda solo el id y la cantidad de cada producto agregado.
  const carrito = {}; // { id: cantidad }

  function precioUnitario(p, cantidad) {
    return cantidad >= CONFIG.cantidadMayoreo ? p.mayoreo : p.menudeo;
  }

  function categorias() {
    var vistas = [], lista = [];
    PRODUCTOS.forEach(function (p) {
      if (vistas.indexOf(p.categoria) === -1) { vistas.push(p.categoria); lista.push(p.categoria); }
    });
    return lista;
  }

  /* ---------- Catálogo (columna izquierda) ---------- */

  function productosDeCategoria(cat, filtro) {
    return PRODUCTOS.filter(function (p) {
      var coincideCategoria = p.categoria === cat;
      var coincideFiltro = !filtro || p.nombre.toLowerCase().indexOf(filtro) !== -1;
      return coincideCategoria && coincideFiltro;
    });
  }

  function filaProducto(p) {
    var cant = carrito[p.id] || 1;
    return (
      '<div class="cot-producto" data-id="' + esc(p.id) + '">' +
        '<div class="cot-producto-texto">' +
          '<span class="cot-producto-nombre">' + esc(p.nombre) + '</span>' +
          '<span class="cot-producto-precios">' + dinero(p.menudeo) + ' / ' + esc(p.unidad) +
            ' &middot; ' + dinero(p.mayoreo) + ' desde ' + CONFIG.cantidadMayoreo + '</span>' +
        '</div>' +
        '<div class="cot-producto-controles">' +
          '<div class="cot-cant">' +
            '<button type="button" class="cot-menos" aria-label="Quitar uno">−</button>' +
            '<input class="cot-cant-input" type="number" inputmode="numeric" min="1" step="1" value="' + cant + '">' +
            '<button type="button" class="cot-mas" aria-label="Agregar uno">+</button>' +
          '</div>' +
          '<button type="button" class="cot-btn-agregar">Agregar</button>' +
        '</div>' +
      '</div>'
    );
  }

  function pintarCatalogo(filtro) {
    var cont = el("categorias");
    var lista = categorias().map(function (cat) {
      var items = productosDeCategoria(cat, filtro);
      if (!items.length) return "";
      var abierta = !!filtro; // si el usuario busca, abre las categorías con resultados
      return (
        '<div class="cot-categoria" data-abierta="' + abierta + '">' +
          '<button type="button" class="cot-categoria-boton">' +
            '<span>' + esc(cat) + ' <span class="cot-categoria-cuenta">(' + items.length + ')</span></span>' +
            '<span class="cot-categoria-flecha" aria-hidden="true">▾</span>' +
          '</button>' +
          '<div class="cot-categoria-cuerpo"' + (abierta ? "" : " hidden") + '>' +
            items.map(filaProducto).join("") +
          '</div>' +
        '</div>'
      );
    }).join("");
    cont.innerHTML = lista || '<p class="cot-vacio">No hay productos que coincidan con tu búsqueda.</p>';
  }

  el("buscador").addEventListener("input", function (e) {
    pintarCatalogo(e.target.value.trim().toLowerCase());
  });

  el("categorias").addEventListener("click", function (e) {
    var botonCat = e.target.closest(".cot-categoria-boton");
    if (botonCat) {
      var cat = botonCat.closest(".cot-categoria");
      var abierta = cat.dataset.abierta === "true";
      cat.dataset.abierta = String(!abierta);
      cat.querySelector(".cot-categoria-cuerpo").hidden = abierta;
      return;
    }

    var fila = e.target.closest(".cot-producto");
    if (!fila) return;
    var id = fila.dataset.id;
    var input = fila.querySelector(".cot-cant-input");

    if (e.target.classList.contains("cot-mas")) {
      input.value = Math.max(1, (parseInt(input.value, 10) || 0) + 1);
    } else if (e.target.classList.contains("cot-menos")) {
      input.value = Math.max(1, (parseInt(input.value, 10) || 1) - 1);
    } else if (e.target.classList.contains("cot-btn-agregar")) {
      var cantidad = Math.max(1, parseInt(input.value, 10) || 1);
      carrito[id] = cantidad;
      render();
      avisar(porId[id].nombre + " agregado a la cotización");
    }
  });

  /* ---------- Carrito / recibo (columna derecha) ---------- */

  function lineasCarrito() {
    return Object.keys(carrito).map(function (id) {
      var p = porId[id];
      var cantidad = carrito[id];
      var unitario = precioUnitario(p, cantidad);
      return {
        id: id,
        nombre: p.nombre,
        detalle: cantidad + " " + p.unidad + " × " + dinero(unitario),
        monto: unitario * cantidad
      };
    });
  }

  function totalCarrito(lineas) {
    return lineas.reduce(function (acc, l) { return acc + l.monto; }, 0);
  }

  function pintarRecibo() {
    var lineas = lineasCarrito();
    var cont = el("recibo-lineas");
    var botones = [el("btn-wa"), el("btn-copiar"), el("btn-imprimir")];

    if (!lineas.length) {
      cont.innerHTML = '<p class="cot-vacio">Agrega productos del catálogo para armar tu cotización.</p>';
      el("recibo-total").textContent = dinero(0);
      el("recibo-nota").textContent = "";
      botones.forEach(function (b) { b.disabled = true; });
      return;
    }

    cont.innerHTML = lineas.map(function (l) {
      return (
        '<div class="cot-linea" data-id="' + esc(l.id) + '">' +
          '<div class="cot-concepto">' +
            '<span class="cot-nombre">' + esc(l.nombre) + '</span>' +
            '<span class="cot-detalle">' + esc(l.detalle) + '</span>' +
          '</div>' +
          '<div class="cot-linea-derecha">' +
            '<span class="cot-monto">' + dinero(l.monto) + '</span>' +
            '<button type="button" class="cot-quitar" aria-label="Quitar ' + esc(l.nombre) + '">×</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    el("recibo-total").textContent = dinero(totalCarrito(lineas));

    var pie = [];
    if (CONFIG.vigenciaDias > 0) pie.push("Válida por " + CONFIG.vigenciaDias + " días.");
    if (CONFIG.nota) pie.push(esc(CONFIG.nota));
    el("recibo-nota").innerHTML = pie.join(" ");

    botones.forEach(function (b) { b.disabled = false; });
  }

  el("recibo-lineas").addEventListener("click", function (e) {
    if (!e.target.classList.contains("cot-quitar")) return;
    var linea = e.target.closest(".cot-linea");
    delete carrito[linea.dataset.id];
    render();
  });

  function render() {
    pintarRecibo();
  }

  /* ---------- Acciones: copiar, imprimir, WhatsApp ---------- */

  var temporizador;
  function avisar(msg) {
    el("estado-accion").textContent = msg;
    clearTimeout(temporizador);
    temporizador = setTimeout(function () { el("estado-accion").textContent = ""; }, 2600);
  }

  function textoCotizacion() {
    var lineas = lineasCarrito();
    var filas = lineas.map(function (l) { return l.nombre + " (" + l.detalle + "): " + dinero(l.monto); });
    var partes = ["Cotización – " + CONFIG.negocio, "Fecha: " + fechaHoy, ""].concat(filas);
    partes.push("Total: " + dinero(totalCarrito(lineas)));
    if (CONFIG.vigenciaDias > 0) partes.push("", "Válida por " + CONFIG.vigenciaDias + " días.");
    return partes.join("\n");
  }

  function copiarRespaldo(texto) {
    var ta = document.createElement("textarea");
    ta.value = texto;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  el("btn-copiar").addEventListener("click", function () {
    if (!Object.keys(carrito).length) return;
    var texto = textoCotizacion();
    var listo = function () { avisar("Cotización copiada"); };
    var fallo = function () {
      avisar(copiarRespaldo(texto) ? "Cotización copiada" : "No se pudo copiar. Selecciona el texto manualmente.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(listo, fallo);
    } else {
      fallo();
    }
  });

  el("btn-imprimir").addEventListener("click", function () {
    var lineas = lineasCarrito();
    if (!lineas.length) return;
    var filas = lineas.map(function (l) {
      return '<tr><td>' + esc(l.nombre) + '<small>' + esc(l.detalle) + '</small></td><td class="m">' + dinero(l.monto) + '</td></tr>';
    }).join("");

    var w = window.open("", "_blank", "width=760,height=900");
    if (!w) { window.print(); return; }
    var pie = [];
    if (CONFIG.vigenciaDias > 0) pie.push("Válida por " + CONFIG.vigenciaDias + " días.");
    if (CONFIG.nota) pie.push(esc(CONFIG.nota));

    w.document.write(
      '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Cotización – ' + esc(CONFIG.negocio) + '</title><style>' +
      'body{font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:#1d2a3a;margin:40px auto;max-width:560px;padding:0 20px}' +
      'h1{font-size:22px;margin:0}p.f{color:#5b6878;margin:4px 0 24px}' +
      'table{width:100%;border-collapse:collapse}td{padding:10px 0;border-bottom:1px dashed #b8c1cc;vertical-align:top}' +
      'td.m{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}small{display:block;color:#5b6878}' +
      '.t td{border-bottom:0;border-top:2px solid #1d2a3a;font-size:20px;font-weight:600;padding-top:14px}' +
      '.n{color:#5b6878;font-size:14px;margin-top:24px}' +
      '</style></head><body><h1>Cotización</h1><p class="f">' + esc(CONFIG.negocio) + ' · ' + esc(fechaHoy) + '</p>' +
      '<table>' + filas + '<tr class="t"><td>Total</td><td class="m">' + dinero(totalCarrito(lineas)) + '</td></tr></table>' +
      '<p class="n">' + pie.join(" ") + '</p></body></html>'
    );
    w.document.close();
    setTimeout(function () { w.focus(); w.print(); }, 300);
  });

  var botonWa = el("btn-wa");
  if (CONFIG.whatsapp) {
    botonWa.hidden = false;
    botonWa.addEventListener("click", function () {
      if (!Object.keys(carrito).length) return;
      var url = "https://wa.me/" + encodeURIComponent(CONFIG.whatsapp) + "?text=" + encodeURIComponent(textoCotizacion());
      window.open(url, "_blank", "noopener");
    });
  }

  /* ---------- Inicio ---------- */

  el("recibo-fecha").textContent = fechaHoy;
  pintarCatalogo("");
  render();
})();
</script>
</body>
</html>
